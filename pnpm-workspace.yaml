# pnpm 10 lee overrides/auditConfig desde aquí (pnpm 9 los lee de package.json;
# se mantienen en ambos lugares hasta unificar la versión de pnpm).
packages:
  - '.'

overrides:
  'rollup@>=3.0.0 <3.30.0': ^3.30.0
  # uuid <11.1.1: out-of-bounds write en v3/v5/v6 con `buf` (GHSA-w5hq-g745-h8pq)
  uuid: ^11.1.1
  # form-data <4.0.6: GHSA-hmw2-7cc7-3qxx (entra vía transbank-sdk > axios)
  form-data: ^4.0.6

  # postcss <=8.5.22 (vía dependencia directa + tailwind). Reemplaza al override
  # anterior 'postcss@8.4.31', que era demasiado estrecho y no cubría 8.5.x.
  postcss: ^8.5.23
  # nanoid <3.3.17 (vía postcss). Se ancla a la línea v3: postcss 8.x declara
  # nanoid ^3 y saltar a v4+ (ESM-only) rompería el build de CSS.
  'nanoid@^3': ^3.3.17
  # js-yaml <4.3.2 (vía eslint > @eslint/eslintrc). CPU/DoS con maxTotalMergeKeys
  # (GHSA-2883-xcg3-v3hh). Anclado a v4: v5 es major.
  'js-yaml@^4': ^4.3.2
  # axios <1.20.0 (vía transbank-sdk, ruta de PAGO en producción). Corrige 11
  # advisories: ReDoS, SSRF por redirect, header injection y prototype pollution
  # (GHSA-c29m-xwm3-cm6r, GHSA-r4gj-5m52-g5wh, GHSA-m8m8-qj5v-23w3, entre otros).
  axios: ^1.20.0
  # sharp <0.35.5 (vía next, optimización de imágenes). Vulns en libheif y
  # librsvg (GHSA-g89c-p67h-r497, GHSA-2jg2-4ch7-h545, GHSA-wq5f-xc86-pv6w).
  sharp: ^0.35.5
  # brace-expansion: ReDoS / stack exhaustion / CPU cuadrática (GHSA-qhr7-859c-m2p7,
  # GHSA-6j4f-fj2g-mc7p, GHSA-q2hr-2g5m-vwhr). Conviven tres líneas mayores en el
  # árbol (eslint/minimatch, @typescript-eslint, resend > @react-email/render),
  # por eso se parchea cada rango por separado en vez de forzar una sola versión.
  'brace-expansion@<1.1.21': ^1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': ^2.1.7
  'brace-expansion@>=4.0.0 <5.0.12': ^5.0.12
  # deepmerge-ts <8.0.0: stack exhaustion con grafos de objetos recursivos
  # (CVE-2026-40345 / GHSA). Entra vía prisma > @prisma/config. El fix está en
  # 8.0.0; sus breaking changes (merge de Map, tipos) no afectan a @prisma/config.
  'deepmerge-ts@<8.0.0': ^8.0.1
  # browserslist <=4.28.6: crash / prototype write vía browserslist-stats.json
  # no confiable (CVE-2026-73088). Dev-only (entra vía next, autoprefixer,
  # eslint-config-next). Fix en 4.28.7.
  'browserslist@<4.28.7': ^4.28.7
  # postcss-selector-parser <7.1.6: CPU cuadrática en selectores planos
  # (GHSA-rj75-hqrm-r3gf). Dev-only (vía tailwindcss). El fix solo existe en v7;
  # se verificó que el CSS generado por Tailwind 3.4 es idéntico con v7.
  'postcss-selector-parser@<7.1.6': ^7.1.6
  # source-map-js <1.2.2: DoS del event loop con offsets de secciones indexadas
  # (GHSA-68fv-2mgg-jv7q). Entra vía next, autoprefixer y vite.
  'source-map-js@<1.2.2': ^1.2.2
  # baseline-browser-mapping <2.11.0: DoS por terminación de proceso con input
  # inválido (vía next). Fix en 2.11.0.
  'baseline-browser-mapping@<2.11.0': ^2.11.0
  # follow-redirects <1.16.1 (vía transbank-sdk > axios, ruta de PAGO): cabeceras
  # de credenciales expuestas al redirigir (GHSA de 2026-10).
  follow-redirects: ^1.16.1
  # zod <4.6.6: agota memoria validando colecciones gigantes con límites
  # (GHSA-mrhx-c7xc-m3w5). Es la validación de TODAS las entradas de la API; la
  # dependencia directa ya va en 4.6.7 y esto cubre las copias transitivas
  # (@vercel/blob > @vercel/oidc, eslint-plugin-react-hooks).
  'zod@<4.6.6': ^4.6.6
  # undici <6.29.1 (vía @vercel/blob, subida de fotos): DoS por content-encodings
  # excesivos y memoria sin límite en EventSource, entre otros
  # (GHSA-xjj6-f33q-929c, GHSA-4qv8-2p9j-2685). Se queda en la línea v6 que pide @vercel/blob.
  'undici@>=4.0.0 <6.29.1': ^6.29.1
  # deepmerge (sin versión corregida) entraba por resend > @react-email/render >
  # html-to-text. No usamos React Email (los correos son HTML): desde resend 6.35
  # ese paquete es opcional y ya no se instala, así que no hace falta override.

# Sin excepciones de auditoría: la de braces (GHSA-vfj7-8cjw-p6xm) se quitó en
# 2026-10 porque el registro de npm ya no reporta ese aviso para braces 3.0.3.
