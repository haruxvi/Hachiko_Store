<!doctype html>

<title>Hachiko · Íconos</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
body{font-family:var(--font-body);background:var(--background);color:var(--on-surface);padding:32px}
h1{font:700 28px var(--font-display);margin-bottom:6px}
p{color:var(--on-surface-variant);max-width:640px;margin-bottom:24px;font-size:14px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.it{background:var(--surface-container-lowest);border:1px solid var(--outline-variant);border-radius:var(--shape-md);padding:16px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.it .nm{font:600 11px ui-monospace,monospace;color:var(--on-surface-variant)}
a{color:var(--on-primary-container)}
</style>
</head>

<h1>Íconos</h1>
<p>Sprite SVG en línea, controlado por tokens: <code>stroke: currentColor; stroke-width: var(--icon-stroke)</code>. Contorno estilo Material (trazo 2, puntas redondeadas) para Android. Toman el color del texto, así que cambian con el tema claro/noche. <a href="index.html">← Volver a la guía</a></p>
<div class="grid" id="grid"></div>
<script>
const ICONS=['home','search','bag','heart','user','store','package','truck','tag','receipt','grid','list','chart','menu','back','chevron-left','chevron-right','chevron-down','close','check','plus','minus','sliders','bell','star','lock','mail','eye','edit','trash','more-v','share','clock','calendar','pin','scan','alert','info','refresh','logout','moon','sun','paw'];
grid.innerHTML=ICONS.map(n=>`<div class="it"><svg class="ico ico--lg"><use href="#i-${n}"/></svg><div class="nm">i-${n}</div></div>`).join('');
</script>
