name: E2E

# Recorre la tienda en un navegador real (Playwright) contra el mismo Docker
# local que usa el equipo: Postgres y credenciales de descarte del
# docker-compose, sin Neon ni secretos. El pago se intercepta antes de salir a
# Transbank (ver tests/e2e/checkout.spec.ts).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start the store (Docker, throwaway data)
        run: docker compose up -d --build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # El entrypoint aplica el esquema y los seeds antes de levantar Next
      - name: Wait for the store
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then exit 0; fi
            sleep 5
          done
          docker compose logs app | tail -100
          exit 1

      - name: E2E tests
        run: pnpm test:e2e

      - name: App logs
        if: failure()
        run: docker compose logs app | tail -200

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
